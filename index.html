<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f3; --border: #dfe2e7;
  --text: #15181d; --muted: #6a717d; --accent: #2f6fed; --accent-text: #ffffff;
  --gain: #1f9d55; --gain-bg: #e3f5ea; --hold: #6a717d; --hold-bg: #eceef1;
  --decline: #d03b3b; --decline-bg: #fbe7e7; --done-bg: #e9f6ee; --pr: #b7791f;
  --radius: 14px; --tap: 48px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --surface: #181b21; --surface-2: #22262e; --border: #2c313a;
    --text: #eef0f3; --muted: #9aa2ae; --accent: #5b8dff; --accent-text: #0b0d10;
    --gain: #3ccf7a; --gain-bg: #15301f; --hold: #a3abb7; --hold-bg: #23272e;
    --decline: #ff6b6b; --decline-bg: #3a1c1c; --done-bg: #16281d; --pr: #f0b44c;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));
  overscroll-behavior-y: none;
}
main { max-width: 560px; margin: 0 auto; padding: 12px 16px 24px; }
h1 { font-size: 24px; margin: 8px 0 12px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; font-weight: 600; }
button, input, select { font: inherit; color: inherit; }
input { font-size: 16px; } /* prevents iOS zoom */
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: var(--tap); border-radius: 12px; background: var(--surface-2); font-weight: 600; padding: 0 16px; }
.btn.primary { background: var(--accent); color: var(--accent-text); }
.btn.danger { color: var(--decline); }
.btn + .btn { margin-top: 8px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .btn + .btn { margin-top: 0; }
.list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.li { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: var(--tap); height: var(--tap); border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--muted); font-size: 20px; }
.empty { padding: 18px 14px; color: var(--muted); text-align: center; }
.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.input { width: 100%; min-height: var(--tap); padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; max-width: 560px; margin: 0 auto; padding: 8px 16px 4px; }
.brand { font-weight: 700; }
.pill { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.pill.warn { background: var(--decline-bg); color: var(--decline); }

/* bottom nav */
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs a { flex: 1; max-width: 140px; text-align: center; padding: 10px 0 8px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600; }
nav.tabs a svg { display: block; margin: 0 auto 2px; width: 24px; height: 24px; }
nav.tabs a.on { color: var(--accent); }
nav.tabs a .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gain); margin-left: 3px; vertical-align: middle; }

/* trend */
.trend { display: flex; align-items: center; gap: 14px; }
.trend .arrow { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; flex: none; }
.trend .arrow svg { width: 32px; height: 32px; }
.trend .status { font-size: 26px; font-weight: 700; line-height: 1.1; }
.s-gain { color: var(--gain); } .s-gain .arrow, .arrow.s-gain { background: var(--gain-bg); }
.s-hold { color: var(--hold); } .s-hold .arrow, .arrow.s-hold { background: var(--hold-bg); }
.s-decline { color: var(--decline); } .s-decline .arrow, .arrow.s-decline { background: var(--decline-bg); }
.s-nodata { color: var(--muted); } .s-nodata .arrow, .arrow.s-nodata { background: var(--surface-2); }
.mini-arrow { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.mini-arrow svg { width: 20px; height: 20px; }
.pct { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

/* active workout */
.wk-name { font-size: 22px; font-weight: 700; border: 0; background: none; padding: 4px 0; width: 100%; }
.wk-name:focus { outline: none; border-bottom: 2px solid var(--accent); }
.ex-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.ex-head .name { flex: 1; font-weight: 700; font-size: 17px; text-align: left; padding: 6px 0; min-width: 0; }
.chip { min-height: 36px; padding: 0 12px; border-radius: 99px; background: var(--surface-2); font-size: 13px; font-weight: 600; }
.chip.on { background: var(--accent); color: var(--accent-text); }
.set-row { display: grid; grid-template-columns: 30px 1fr 58px 48px 30px; gap: 6px; align-items: center; padding: 4px 0; border-radius: 10px; }
.set-row.head { font-size: 12px; color: var(--muted); padding: 6px 0 0; }
.set-row.head span { text-align: center; }
.set-row.done { background: var(--done-bg); }
.set-n { height: 40px; border-radius: 8px; font-weight: 700; color: var(--muted); position: relative; }
.set-n.has-note::after { content: ""; position: absolute; top: 6px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.stepper { display: grid; grid-template-columns: 44px 1fr 44px; height: var(--tap); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
.stepper button { font-size: 22px; font-weight: 600; background: var(--surface-2); }
.stepper input, .reps { border: 0; background: var(--surface); text-align: center; font-weight: 700; font-size: 18px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.reps { height: var(--tap); border: 1px solid var(--border); border-radius: 12px; }
.stepper input:focus, .reps:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.check { width: 48px; height: var(--tap); border-radius: 12px; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.check svg { width: 24px; height: 24px; }
.done .check { background: var(--gain); color: #fff; }
.del { height: 40px; color: var(--muted); font-size: 18px; }
.add-set { width: 100%; min-height: 44px; margin-top: 6px; border-radius: 10px; color: var(--accent); font-weight: 600; background: var(--surface-2); }
.last { font-size: 13px; margin-bottom: 4px; }

/* history */
.set-line { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); width: 100%; text-align: left; min-height: 48px; align-items: center; }
.set-line:last-child { border-bottom: 0; }
.pr { color: var(--pr); font-weight: 700; font-size: 12px; }
.best { background: color-mix(in srgb, var(--pr) 14%, transparent); }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.seg button { flex: 1; min-height: 40px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
.stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
canvas.chart { width: 100%; height: 180px; display: block; }

/* sheet (modal) */
.backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; }
.backdrop.open { display: flex; }
.sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet h3 { margin: 4px 0 12px; font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }

/* template editor */
.tpl-row { display: grid; grid-template-columns: 1fr 56px 56px auto; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.tpl-row .input { text-align: center; padding: 0 4px; }
.tpl-row .tools { display: flex; }
.tpl-row .tools button { width: 34px; height: 44px; color: var(--muted); font-size: 16px; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<header class="topbar"><span class="brand">Lift Log</span><button id="sync-pill" class="pill" data-act="syncNow">…</button></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
